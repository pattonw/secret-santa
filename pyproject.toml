[project]
name = "ss"
version = "0.2.0"
description = "Secret santa assignments via integer programming, letter-style emails and an anonymous message relay"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "William Patton" }]
requires-python = ">=3.10"
dependencies = [
  "scipy>=1.11",
  "numpy>=1.24",
  "cryptography>=42",
  "click>=8.1",
  "omegaconf>=2.3",
  "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/pattonw/secret-santa"

[project.scripts]
secret-santa = "ss.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
